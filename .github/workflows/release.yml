name: Release

# Every merge of develop → main (and a tag v*) publishes Linux + Windows binaries.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Build
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="nightly-${GITHUB_SHA::7}"
          fi
          make build VERSION="${VERSION}"
      - name: Package
        run: |
          mkdir -p dist
          tar -C bin -czf dist/anoted-linux-amd64.tar.gz anoted
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/anoted-linux-amd64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      # malgo / WASAPI need a gcc. The runner does not always have one on PATH.
      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          foreach ($p in @(
            "C:\ProgramData\mingw64\mingw64\bin",
            "C:\mingw64\bin"
          )) {
            if (Test-Path $p) {
              "$p" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              break
            }
          }
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="nightly-${GITHUB_SHA::7}"
          fi
          gcc --version
          go build -trimpath -ldflags "-s -w -X anoted/internal/buildinfo.version=${VERSION}" -o anoted.exe ./cmd/anoted
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          powershell.exe -NoProfile -Command "Compress-Archive -Force -Path anoted.exe -DestinationPath dist/anoted-windows-amd64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/anoted-windows-amd64.zip

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum anoted-linux-amd64.tar.gz anoted-windows-amd64.zip > SHA256SUMS
      - name: Publish nightly (main)
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nightly --repo "${{ github.repository }}" >/dev/null 2>&1 \
            && gh release delete nightly --yes --cleanup-tag --repo "${{ github.repository }}" \
            || true
          gh release create nightly dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --latest=false \
            --title "Nightly ${GITHUB_SHA::7}" \
            --notes "Latest build from main (${GITHUB_SHA}), published when develop is merged. Free code signing provided by SignPath.io, certificate by SignPath Foundation. Windows exe may still be unsigned until a signing request is approved. Replaced on every merge to main."
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --latest
